<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Class Catch-Up architecture</title>
  <desc id="desc">Teacher-controlled catch-up packet workflow using React, FastAPI, a durable worker, Strands Agents SDK, scoped tools, PostgreSQL, and private source storage.</desc>
  <defs>
    <style>
      .bg{fill:#f4f0e7}.panel{fill:#fffdf8;stroke:#d5ccbc;stroke-width:2}.dark{fill:#153f36}.honey{fill:#e4a83a}.mint{fill:#dcebe4}.ink{fill:#153f36}.muted{fill:#5e6e68}.white{fill:#fff}.line{stroke:#1d6f5c;stroke-width:4;fill:none;marker-end:url(#arrow)}.dash{stroke:#b87b14;stroke-width:3;stroke-dasharray:10 9;fill:none;marker-end:url(#arrow2)}
      text{font-family:Inter,Segoe UI,Arial,sans-serif}.title{font:700 54px Georgia,serif}.sub{font-size:23px}.label{font-size:24px;font-weight:700}.small{font-size:18px}.tiny{font-size:16px}.caps{font-size:16px;font-weight:800;letter-spacing:2px}
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#1d6f5c"/></marker>
    <marker id="arrow2" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#b87b14"/></marker>
  </defs>
  <rect class="bg" width="1600" height="900"/>
  <text x="90" y="90" class="title ink">Class Catch-Up</text>
  <text x="90" y="132" class="sub muted">Source-grounded absence recovery with teacher approval</text>

  <rect x="85" y="210" width="280" height="170" rx="24" class="panel"/>
  <circle cx="135" cy="260" r="23" class="dark"/><text x="127" y="268" class="small white">1</text>
  <text x="175" y="267" class="label ink">Teacher</text>
  <text x="115" y="315" class="small muted">Uploads material</text><text x="115" y="344" class="small muted">Confirms lesson scope</text>

  <rect x="455" y="190" width="310" height="210" rx="24" class="panel"/>
  <text x="495" y="245" class="caps ink">WEB APPLICATION</text>
  <text x="495" y="290" class="label ink">React + Vite</text>
  <text x="495" y="330" class="small muted">Teacher review</text><text x="495" y="360" class="small muted">Learner assignments</text>

  <rect x="855" y="190" width="310" height="210" rx="24" class="panel"/>
  <text x="895" y="245" class="caps ink">TRUST BOUNDARY</text>
  <text x="895" y="290" class="label ink">FastAPI</text>
  <text x="895" y="330" class="small muted">Tenant + role scope</text><text x="895" y="360" class="small muted">CSRF + validation</text>

  <rect x="1260" y="205" width="255" height="175" rx="24" class="panel"/>
  <text x="1300" y="260" class="caps ink">EVIDENCE</text>
  <text x="1300" y="305" class="label ink">Private sources</text>
  <text x="1300" y="338" class="small muted">Stable segments</text>

  <path d="M365 295H455" class="line"/><path d="M765 295H855" class="line"/><path d="M1165 295H1260" class="line"/>

  <rect x="410" y="520" width="350" height="220" rx="24" class="dark"/>
  <text x="455" y="575" class="caps honey">DURABLE WORKER</text>
  <text x="455" y="620" class="label white">Strands Agents SDK</text>
  <text x="455" y="660" class="small white">Five server-scoped tools</text><text x="455" y="691" class="small white">Bounded retries + leases</text>

  <rect x="870" y="520" width="330" height="220" rx="24" class="panel"/>
  <text x="915" y="575" class="caps ink">DETERMINISTIC GATE</text>
  <text x="915" y="620" class="label ink">Packet validator</text>
  <text x="915" y="660" class="small muted">Scoped citations</text><text x="915" y="691" class="small muted">Exact revision + hash</text>

  <path d="M1010 400V465H585V520" class="line"/><path d="M760 630H870" class="line"/>
  <path d="M1035 740V800H245V380" class="dash"/>
  <text x="485" y="835" class="caps ink">TEACHER APPROVAL RELEASES AN IMMUTABLE PACKET</text>

  <rect x="1260" y="535" width="255" height="175" rx="24" class="mint" stroke="#aacabb" stroke-width="2"/>
  <text x="1300" y="590" class="caps ink">DELIVERY</text>
  <text x="1300" y="635" class="label ink">Learner portal</text>
  <text x="1300" y="668" class="small muted">Published work only</text>
  <path d="M1200 630H1260" class="line"/>
  <text x="90" y="865" class="tiny muted">Synthetic local demo • Provider failures remain explicit • No student answer keys cross the API boundary</text>
</svg>
